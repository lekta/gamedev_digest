name: Daily GameDev Digest

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC = 07:17 UTC+2 (Сербия); с учётом задержки GitHub ~2–2.5 ч выпуск готов к ~10:00 местного. Нестандартная минута — короче очередь
  workflow_dispatch: {} # ручной запуск: GitHub → Actions → Run workflow (работает и из мобильного приложения)

# Плановый и ручной запуски не выполняются одновременно: второй ждёт первого
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Проверить, не собран ли уже сегодняшний выпуск
        id: guard
        run: |
          TODAY=$(TZ=Europe/Moscow date +%F)
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          # Плановый запуск пропускаем, если выпуск за сегодня уже есть (например, собран вручную).
          # Ручной запуск (workflow_dispatch) всегда пересобирает — для правок.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "digests/${TODAY}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Выпуск за ${TODAY} уже собран — плановый запуск пропущен."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать выпуск
        id: claude
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bash(TZ=Europe/Moscow date:*) — без него команда с префиксом TZ= не попадает
          # под шаблон Bash(date:*) и упирается в отказ по правам.
          # Шаблоны матчатся по ПРЕФИКСУ команды, поэтому составная строка (цикл for,
          # пайп, &&) целиком не попадает ни под один шаблон и уходит в отказ — так
          # 17.08 подряд отвалились четыре вызова `for f in digests/...; do tail ...`.
          # Открывать Bash целиком нельзя: в окружении шага живёт GITHUB_TOKEN с
          # contents:write, а сборка час читает недоверенный веб — это готовая
          # поверхность для инъекции. Вместо этого расширен список простых команд,
          # а в промпте запрещены циклы и пайплайны.
          claude_args: '--model claude-opus-5 --allowedTools "Read,Write,Edit,Glob,Grep,Task,WebSearch,WebFetch,Bash(grep:*),Bash(date:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(TZ=Europe/Moscow date:*)"'
          prompt: |
            Собери сегодняшний выпуск GameDev Digest — ежедневной сводки новостей геймдева для Unity/C#-разработчика. Ты находишься в корне репозитория дайджеста.

            Дата выпуска — ${{ steps.guard.outputs.today }} (сегодня, UTC+3). Определять дату самостоятельно не нужно.

            1. Прочитай config.md — это единственный источник правил: тематика, структура «новость → вывод → детали», объём, язык (только русский), антиповторы и 3-дневный кулдаун, проверка фактов на истинность, первоисточники.
            2. Прочитай memory/covered.md (что уже освещено), memory/to_explore.md (очередь тем), memory/sources.md (реестр источников).
            3. Собери дайджест строго по config.md.
            4. Запиши результат в файлы:
               - digests/${{ steps.guard.outputs.today }}.md — новый выпуск;
               - memory/covered.md — добавь сегодняшний день, убери выпавший из окна 3 дней;
               - memory/to_explore.md — обнови при необходимости.
            5. Git-команд не выполняй — коммит сделает следующий шаг workflow.
            6. Если digests/${{ steps.guard.outputs.today }}.md уже существует — пересобери его заново с учётом свежих новостей и перезапиши.

            ## Регламент работы (добавлено после провала 17.08)

            **Ты здесь один, и вся задача на тебе.** Прогон идёт без человека: никто не
            ответит, не подтвердит и не продолжит за тебя. Фоновых процессов не бывает —
            если ты закончишь ход, прогон закончится вместе с ним.

            **Нельзя заканчивать ход текстом-обещанием.** Пока файл выпуска не записан,
            каждое твоё сообщение обязано содержать вызов инструмента. Формулировки вида
            «подожду результата», «вернусь, когда придут данные», «пауза до ответа
            агента» означают провал прогона — обещание работой не является. Не знаешь,
            что делать дальше, — делай следующий поиск или пиши черновик, но не
            останавливайся.

            **Подагенты (Task) — можно и полезно, но синхронно.** Веерная разведка по
            источникам через подагентов приветствуется: запускай их ПАЧКОЙ в одном
            сообщении, тогда они отработают параллельно. Task синхронный — результат
            приходит обычным ответом инструмента прямо в этом же ходу. Состояния «агент
            ещё работает, подожду» НЕ СУЩЕСТВУЕТ; если тебе так кажется — это ошибка,
            просто продолжай работу. Подагентам поручай только сбор кандидатов (ссылка,
            дата, суть). Проверка фактов, отбор, кулдаун и весь текст выпуска — твои,
            файлы подагенты не пишут.

            **Bash — одна простая команда на вызов.** Без циклов for/while, без
            пайплайнов, без `&&` и `;`: права выданы по префиксу команды, и составная
            строка целиком уходит в отказ. Файлы читай через Read и Glob, а не через
            bash. Если команда отклонена по правам — не переформулируй её третий раз,
            перейди на Read/Glob или обойдись без неё.

            **Черновик пишется рано.** Как только отобраны первые главные новости —
            сразу запиши черновой digests/${{ steps.guard.outputs.today }}.md на диск,
            а дальше дорабатывай его через Edit. Непустой черновик лучше идеального
            выпуска, который не успел родиться.

            ВАЖНО: выпуск обязан быть записан на диск. Файл digests/${{ steps.guard.outputs.today }}.md
            должен существовать к концу твоей работы — иначе прогон считается провалившимся.
            Если собрать выпуск по правилам не получается (нечего брать, упёрся в отказ по правам,
            не хватает данных) — не завершайся молча: запиши причину в memory/buildlog.md
            отдельной секцией «## ${{ steps.guard.outputs.today }} — сборка не удалась»
            и подробно объясни её в финальном сообщении.

      # Полный вывод Claude в лог не печатается, поэтому без этого шага причина пустого
      # прогона теряется вместе с раннером
      - name: Подготовить лог сборки
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p _logs
          SRC="${{ steps.claude.outputs.execution_file }}"
          if [ ! -f "$SRC" ]; then SRC="${RUNNER_TEMP}/claude-execution-output.json"; fi
          if [ -f "$SRC" ]; then
            cp "$SRC" "_logs/claude-${{ steps.guard.outputs.today }}.json"
          else
            echo "Лог сборки не найден ни по outputs.execution_file, ни в RUNNER_TEMP" \
              > "_logs/claude-${{ steps.guard.outputs.today }}.txt"
          fi

      - name: Сохранить лог сборки
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ steps.guard.outputs.today }}
          path: _logs/
          retention-days: 14
          if-no-files-found: warn

      # Claude может завершиться «успешно», не записав ни одного файла (так пропал выпуск 01.08.2026)
      # или записав файл-заглушку и оборвав ход (так пропал выпуск 30.08.2026: 160 байт с пометкой
      # «ЧЕРНОВИК», прогон зелёный, заглушка уехала в фид). Проверка `-s` такое пропускает, поэтому
      # смотрим не факт существования файла, а его содержимое. Провал здесь останавливает и сборку
      # фида, и коммит: у следующих шагов условие без status-функции, значит действует неявный
      # success() — черновик до репозитория не доедет.
      - name: Проверить, что выпуск записан
        if: steps.guard.outputs.skip != 'true'
        run: |
          TODAY="${{ steps.guard.outputs.today }}"
          FILE="digests/${TODAY}.md"
          MIN_BYTES=2500   # самый короткий настоящий выпуск за всю историю — 3413 байт
          MIN_LINKS=2      # в каждом выпуске есть ссылки на первоисточники
          fail() {
            echo "::error::$1 Смотри артефакт claude-log-${TODAY}."
            echo "--- что изменилось в рабочей копии ---"
            git status --porcelain
            if [ -f "$FILE" ]; then
              echo "--- начало ${FILE} ---"
              head -40 "$FILE"
            fi
            exit 1
          }
          if [ ! -s "$FILE" ]; then
            fail "Claude отработал, но ${FILE} не создан или пуст."
          fi
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            fail "${FILE} — всего ${SIZE} байт при минимуме ${MIN_BYTES}: это заглушка, а не выпуск."
          fi
          if grep -qiE '<!--[^>]*([Чч][Ее][Рр][Нн][Оо][Вв][Ии][Кк]|draft|[Зз]аглушка|placeholder|[Пп]ерезапис)' "$FILE"; then
            fail "В ${FILE} осталась пометка черновика — выпуск не доведён до конца."
          fi
          LINKS=$(grep -c 'http' "$FILE" || true)
          if [ "$LINKS" -lt "$MIN_LINKS" ]; then
            fail "В ${FILE} строк со ссылками: ${LINKS} при минимуме ${MIN_LINKS} — первоисточники не проставлены."
          fi
          echo "${FILE}: ${SIZE} байт, ${LINKS} строк со ссылками — ок"

      - name: Собрать RSS-фид
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install --quiet markdown
          python3 scripts/build_feed.py

      - name: Закоммитить выпуск
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digests memory feed.xml
          git diff --cached --quiet || git commit -m "Выпуск $(TZ=Europe/Moscow date +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:master
