name: Daily GameDev Digest

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC; GitHub задерживает запуск на часы — выпуск к полудню по Белграду это норма
  workflow_dispatch: {} # ручной запуск: GitHub → Actions → Run workflow (работает и из мобильного приложения)

# Плановый и ручной запуски не выполняются одновременно: второй ждёт первого
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Проверить, не собран ли уже сегодняшний выпуск
        id: guard
        run: |
          TODAY=$(TZ=Europe/Moscow date +%F)
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          # Плановый запуск пропускаем, если выпуск за сегодня уже есть (например, собран вручную).
          # Ручной запуск (workflow_dispatch) всегда пересобирает — для правок.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "digests/${TODAY}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Выпуск за ${TODAY} уже собран — плановый запуск пропущен."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать выпуск
        id: claude
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Права Bash выданы по ПРЕФИКСУ команды: составная строка (цикл, пайп, &&) целиком
          # уходит в отказ. Открывать Bash целиком нельзя: в окружении шага живёт GITHUB_TOKEN
          # с contents:write, а сборка читает недоверенный веб. scripts/og_image.py только
          # делает GET и печатает один адрес картинки — возможностей сверх WebFetch не даёт.
          claude_args: '--model claude-opus-5-5 --allowedTools "Read,Write,Edit,Glob,Grep,Task,WebSearch,WebFetch,Bash(grep:*),Bash(date:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(TZ=Europe/Moscow date:*),Bash(python3 scripts/og_image.py:*)"'
          prompt: |
            Собери сегодняшний выпуск GameDev Digest. Ты в корне репозитория дайджеста.
            Дата выпуска — ${{ steps.guard.outputs.today }} (UTC+3), определять её самому не нужно.

            1. Прочитай config.md — единственный источник правил. Затем reporters.md,
               memory/covered.md, memory/to_explore.md, memory/sources.md.
            2. Собери выпуск строго по config.md.
            3. Запиши:
               - digests/${{ steps.guard.outputs.today }}.md — выпуск (если файл уже есть — пересобери и перезапиши);
               - memory/covered.md, memory/to_explore.md, memory/buildlog.md — по разделу 9 config.md.
            4. Git-команд не выполняй — коммит сделает следующий шаг.

            Регламент прогона:
            - Ты здесь один, человека нет. Пока файл выпуска не записан, каждое твоё сообщение
              содержит вызов инструмента. Закончить ход обещанием («подожду», «вернусь позже») —
              провал прогона.
            - Подагенты (Task) — для разведки кандидатов, пачкой в одном сообщении. Task
              синхронный: результат приходит в этом же ходу, ждать нечего. Отбор, проверка
              фактов и весь текст — твои, файлы подагенты не пишут.
            - Bash — одна простая команда на вызов, без циклов, пайпов, `&&` и `;`. Файлы читай
              через Read и Glob. Отклонённую команду не переформулируй — обойдись без неё.
            - Картинки: `python3 scripts/og_image.py <адрес>` или `--steam <игра>` (config.md, раздел 3).
            - Как только отобраны главные новости — запиши черновик выпуска на диск и дорабатывай
              через Edit. Заглушку без новостей не пиши: проверка после сборки её отбракует.
            - Если собрать выпуск не получается — запиши причину в memory/buildlog.md секцией
              «## ${{ steps.guard.outputs.today }} — сборка не удалась» и объясни в финальном сообщении.

      # Полный вывод Claude в лог не печатается, поэтому без этого шага причина пустого
      # прогона теряется вместе с раннером
      - name: Подготовить лог сборки
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p _logs
          SRC="${{ steps.claude.outputs.execution_file }}"
          if [ ! -f "$SRC" ]; then SRC="${RUNNER_TEMP}/claude-execution-output.json"; fi
          if [ -f "$SRC" ]; then
            cp "$SRC" "_logs/claude-${{ steps.guard.outputs.today }}.json"
          else
            echo "Лог сборки не найден ни по outputs.execution_file, ни в RUNNER_TEMP" \
              > "_logs/claude-${{ steps.guard.outputs.today }}.txt"
          fi

      - name: Сохранить лог сборки
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ steps.guard.outputs.today }}
          path: _logs/
          retention-days: 14
          if-no-files-found: warn

      # Claude может завершиться «успешно», не записав ни одного файла (так пропал выпуск 01.08.2026)
      # или записав файл-заглушку и оборвав ход (так пропал выпуск 30.08.2026: 160 байт с пометкой
      # «ЧЕРНОВИК», прогон зелёный, заглушка уехала в фид). Проверка `-s` такое пропускает, поэтому
      # смотрим не факт существования файла, а его содержимое. Провал здесь останавливает и сборку
      # фида, и коммит: у следующих шагов условие без status-функции, значит действует неявный
      # success() — черновик до репозитория не доедет.
      - name: Проверить, что выпуск записан
        if: steps.guard.outputs.skip != 'true'
        run: |
          TODAY="${{ steps.guard.outputs.today }}"
          FILE="digests/${TODAY}.md"
          MIN_BYTES=2500   # самый короткий настоящий выпуск за всю историю — 3413 байт
          MIN_LINKS=2      # в каждом выпуске есть ссылки на первоисточники
          fail() {
            echo "::error::$1 Смотри артефакт claude-log-${TODAY}."
            echo "--- что изменилось в рабочей копии ---"
            git status --porcelain
            if [ -f "$FILE" ]; then
              echo "--- начало ${FILE} ---"
              head -40 "$FILE"
            fi
            exit 1
          }
          if [ ! -s "$FILE" ]; then
            fail "Claude отработал, но ${FILE} не создан или пуст."
          fi
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            fail "${FILE} — всего ${SIZE} байт при минимуме ${MIN_BYTES}: это заглушка, а не выпуск."
          fi
          if grep -qiE '<!--[^>]*([Чч][Ее][Рр][Нн][Оо][Вв][Ии][Кк]|draft|[Зз]аглушка|placeholder|[Пп]ерезапис)' "$FILE"; then
            fail "В ${FILE} осталась пометка черновика — выпуск не доведён до конца."
          fi
          LINKS=$(grep -c 'http' "$FILE" || true)
          if [ "$LINKS" -lt "$MIN_LINKS" ]; then
            fail "В ${FILE} строк со ссылками: ${LINKS} при минимуме ${MIN_LINKS} — первоисточники не проставлены."
          fi
          echo "${FILE}: ${SIZE} байт, ${LINKS} строк со ссылками — ок"

      # Окна памяти (3 дня covered, 7 дней buildlog, 28 дней и 40 тем в очереди) держит скрипт,
      # а не сборщик: без этого to_explore.md за три месяца вырос до 1,4 МБ.
      - name: Привести память в рамки
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/trim_memory.py

      - name: Собрать RSS-фид
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install --quiet markdown
          python3 scripts/build_feed.py

      - name: Закоммитить выпуск
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digests memory feed.xml
          git diff --cached --quiet || git commit -m "Выпуск $(TZ=Europe/Moscow date +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:master
